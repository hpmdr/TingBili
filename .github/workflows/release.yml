name: Release
# 打 tag 即发版：git tag v1.0.0 && git push origin v1.0.0
# 也可在 Actions 页面手动触发（输入版本号如 1.0.0）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 1.0.0，会自动建 tag v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-cmdline-tools-23.0-platform-37.0-buildtools-36.0.0
      - name: Setup Android SDK (official cmdline-tools)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          if [ -x "$SDK/cmdline-tools/latest/bin/android" ]; then
            echo "cmdline-tools 命中缓存，跳过下载"
          else
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
            echo "e025545c62a8e64c7559119566a569fb1dec5f60  /tmp/cmdline-tools.zip" | sha1sum -c -
            rm -rf /tmp/ct && mkdir -p /tmp/ct
            unzip -q /tmp/cmdline-tools.zip -d /tmp/ct
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK components
        run: |
          set -euo pipefail
          android sdk install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Resolve version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Decode release keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "缺少 Secret RELEASE_KEYSTORE_BASE64（及配套密码），按 README 发版流程配置" >&2
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          echo "RELEASE_STORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"
      - name: Assemble Release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 包名与 app/build.gradle.kts 的 outputFileName 同口径：
          # TingBili_{version}_android.apk（APP_VERSION_NAME 即 tag 去 v）
          APK="app/build/outputs/apk/release/TingBili_${APP_VERSION_NAME}_android.apk"
          test -f "$APK" || { echo "找不到 $APK" >&2; exit 1; }
          ( cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：先去 Releases 页删除再重打" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes "手动发版 $TAG" "$APK" "$APK.sha256"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$APK" "$APK.sha256"
          fi
