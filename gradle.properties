org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# 日常迭代保留 daemon（3 小时）；CI 用 --no-daemon 即可。原来 30s 自杀会让每次思考后都冷启动。
org.gradle.daemon.idletimeout=10800000
# 13 模块可并行；构建缓存让 CI 与本地复用输出
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存与 configure-on-demand 互斥，且 AGP 9 + KSP 的兼容性未验证，暂不开启（见 docs/FIX_PLAN.md F1c）
org.gradle.configureondemand=false
android.useAndroidX=true
# 已删除无效属性 android.nonTransitiveRResources（AGP 9.4.1 无此键；正确名 nonTransitiveRClass 默认即 true）。
# 也不再需要 android.suppressUnsupportedCompileSdk=37：AGP 9.4.1 的 ToolsRevisionUtils 已含 AndroidVersion(37,2)。
